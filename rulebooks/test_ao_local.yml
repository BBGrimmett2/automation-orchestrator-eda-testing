---
# Simple test rulebook for local AO workflow testing
# Usage:
#   1. Set environment variables (see .env.example)
#   2. Run: source .env && ansible-rulebook -i inventory.yml --rulebook test_ao_local.yml
#
# Test with curl:
#   curl -X POST http://localhost:5000/endpoint \
#     -H "Content-Type: application/json" \
#     -d '{"alert_type": "test", "message": "Hello AO!"}'

- name: AO Workflow Test
  hosts: localhost
  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000

  # Test 1: Disk alert triggers cleanup workflow
    - name: Disk Alert - Trigger Cleanup
      condition: event.payload.event_type == "disk_alert"
      action:
        run_ao_workflow:
          webhook_path: "ops/disk-cleanup"
          payload:
            hostname: "{{ event.payload.host }}"
            disk_usage: "{{ event.payload.disk_usage }}"
            alert_source: "EDA Event Stream"
            timestamp: "{{ event.meta.received_at }}"
          timeout: 300
          poll_interval: 5
          post_facts: true
          post_events: false

    # Test 2: Service issue triggers restart workflow
    - name: Service Issue - Trigger Restart
      condition: event.payload.event_type == "service_issue"
      action:
        run_ao_workflow:
          workflow_name: "Service Restart"
          project: "Operations"
          payload:
            service_name: "{{ event.payload.service_name }}"
            vm_name: "{{ event.payload.vm_name }}"
            status: "{{ event.payload.status }}"
          timeout: 180
          post_facts: true

    # Test 3: Generic test event
    - name: Test Event - Simple Workflow
      condition: event.payload.event_type == "test_event"
      action:
        run_ao_workflow:
          webhook_path: "test/simple-workflow"
          payload:
            message: "{{ event.payload.message | default('Test from EDA') }}"
            timestamp: "{{ event.meta.received_at }}"
          timeout: 60
          post_facts: true

    # Debug rule - catch all other events
    - name: Debug all events
      condition: event.payload is defined
      action:
        debug:
          msg: "Received event: type={{ event.payload.event_type | default('unknown') }}, payload={{ event.payload }}"
