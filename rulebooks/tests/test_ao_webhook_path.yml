---
# Test: Direct webhook_path parameter
#
# Purpose: Test triggering AO workflows using direct webhook UUID
# Expected: Workflow triggers successfully with webhook_path

- name: Test Direct Webhook Path
  hosts: localhost
  sources:
    - ansible.eda.pg_listener:
        dsn: "{{ PG_DSN }}"
        channels:
          - eda_event_stream_f58f05ae_0bf7_4b5a_8929_b17eaec45eb3

  rules:
    - name: Test 1 - Minimal webhook_path
      condition: event.payload.test_id == "webhook_path_minimal"
      action:
        run_ao_workflow:
          ao_host: "{{ ao_url }}"
          ao_client_id: "{{ ao_client_id }}"
          ao_client_secret: "{{ ao_client_secret }}"
          webhook_path: "755d5f81-a574-4ea3-8461-1934cb4a5c51"

    - name: Test 2 - Webhook path with simple payload
      condition: event.payload.test_id == "webhook_path_with_payload"
      action:
        run_ao_workflow:
          ao_host: "{{ ao_url }}"
          ao_client_id: "{{ ao_client_id }}"
          ao_client_secret: "{{ ao_client_secret }}"
          webhook_path: "755d5f81-a574-4ea3-8461-1934cb4a5c51"
          payload:
            message: "Test from EDA"
            test_id: "{{ event.payload.test_id }}"
            timestamp: "{{ event.meta.received_at }}"

    - name: Test 3 - Webhook path with complex payload
      condition: event.payload.test_id == "webhook_path_complex_payload"
      action:
        run_ao_workflow:
          ao_host: "{{ ao_url }}"
          ao_client_id: "{{ ao_client_id }}"
          ao_client_secret: "{{ ao_client_secret }}"
          webhook_path: "755d5f81-a574-4ea3-8461-1934cb4a5c51"
          payload:
            event_data:
              test_id: "{{ event.payload.test_id }}"
              event_type: "{{ event.payload.event_type }}"
              hostname: "{{ event.payload.host | default('unknown') }}"
              severity: "{{ event.payload.severity | default('info') }}"
            metadata:
              source: "EDA Event Stream"
              received_at: "{{ event.meta.received_at }}"
              event_uuid: "{{ event.meta.uuid }}"
            computed_values:
              priority: "{{ 'high' if event.payload.severity == 'critical' else 'normal' }}"

    - name: Test 4 - Webhook path with SSL disabled
      condition: event.payload.test_id == "webhook_path_no_ssl"
      action:
        run_ao_workflow:
          ao_host: "{{ ao_url }}"
          ao_client_id: "{{ ao_client_id }}"
          ao_client_secret: "{{ ao_client_secret }}"
          ao_verify_ssl: "no"
          webhook_path: "755d5f81-a574-4ea3-8461-1934cb4a5c51"
          payload:
            message: "Test with SSL verification disabled"
