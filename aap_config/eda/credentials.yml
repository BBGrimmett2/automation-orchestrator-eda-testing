---
# EDA Credentials Configuration
eda_credentials:
  # Automation Orchestrator Token for Event Stream
  - name: "Automation Orchestrator Event Stream Token"
    organization: "AO Integration Organization"
    description: "Token credential for Automation Orchestrator event stream"
    credential_type: Token Event Stream
    inputs:
      token: "{{ vault_ao_event_stream_token }}"
      http_header_key: Authorization

  # Red Hat Automation Orchestrator Credential
  - name: "Red Hat Automation Orchestrator"
    organization: "AO Integration Organization"
    description: "Credential for triggering AO workflows via webhook"
    credential_type: "Red Hat Automation Orchestrator"
    inputs:
      host: "{{ vault_ao_host }}"
      client_id: "{{ vault_ao_client_id }}"
      client_secret: "{{ vault_ao_client_secret }}"
      verify_ssl: false