---
# EDA Custom Credential Types Configuration
eda_credential_types:
  - name: "Red Hat Automation Orchestrator"
    description: ""
    kind: cloud
    inputs:
      fields:
        - id: host
          type: string
          label: "Automation Orchestrator URL"
          help_text: "Automation Orchestrator base URL to authenticate with. 'Example: https://ao-host.example.com'"
        - id: client_id
          type: string
          label: "OAuth2 Client ID"
          help_text: "OAuth2 client ID for authentication. This is the recommended method for authenticating with Automation Orchestrator."
        - id: client_secret
          type: string
          label: "OAuth2 Client Secret"
          secret: true
          help_text: "OAuth2 client secret for authentication. Used in combination with the client ID for OAuth2 client_credentials grant flow."
        - id: verify_ssl
          type: boolean
          label: "Verify SSL"
          default: true
          help_text: "Whether to verify SSL certificates when connecting to Automation Orchestrator. Set to false only in development/testing environments."
      required:
        - host
        - client_id
        - client_secret
    injectors:
      env:
        EDA_AO_URL: !unsafe "{{ host }}"
        EDA_AO_CLIENT_ID: !unsafe "{{ client_id }}"
        EDA_AO_SSL_VERIFY: !unsafe "{{ verify_ssl }}"
        EDA_AO_CLIENT_SECRET: !unsafe "{{ client_secret }}"
      extra_vars:
        ao_url: !unsafe "{{ host }}"
        ao_client_id: !unsafe "{{ client_id }}"
        ao_verify_ssl: !unsafe "{{ verify_ssl }}"
        ao_client_secret: !unsafe "{{ client_secret }}"